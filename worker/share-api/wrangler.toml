name = "flickto-share-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Bind to flickto.app/api/share* (JSON API) and /share/* (human
# landing page), plus the E2EE social channel (user profiles/opinions/access,
# inbox, friendcode), the portable-identity backup + live friends record, and
# the data-deletion endpoints. Legal pages (/privacy, /delete) are now served
# as static HTML by the flickto-content worker.
routes = [
  { pattern = "flickto.app/api/share", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/share/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/share/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/user/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/opinions/batch", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/inbox/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/friendcode", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/friendcode/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/social/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/account/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/auth/*", zone_name = "flickto.app" },
  # Phase 2 server-authoritative profiles. Without these patterns the Worker never
  # sees the requests at all — and `wrangler deploy --dry-run` passes regardless.
  { pattern = "flickto.app/api/me/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/profile/*", zone_name = "flickto.app" },
  # Phase 3/4. Note the bare patterns as WELL as the wildcards: `/api/friends/*`
  # does NOT match `/api/friends`, so the list endpoint would fall through to the
  # static site and answer 404 while every test and the dry-run stayed green.
  { pattern = "flickto.app/api/friends", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/friends/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/blocks", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/blocks/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/report", zone_name = "flickto.app" },
  # Bare pattern: /api/feed is not matched by any wildcard above. The trailing `*`
  # is NOT optional either — routes match the full URL including the query string,
  # so a bare `…/api/feed` answers `/api/feed` but lets `/api/feed?limit=50` — the
  # only form the client actually sends — fall through to the static site as a 404.
  # This is the same trap as `/api/friends` above, from the other direction, and it
  # is invisible to both the test suite and `wrangler deploy --dry-run`.
  { pattern = "flickto.app/api/feed*", zone_name = "flickto.app" },
  # One chargeable request per refresh (src/sync.ts). Same wildcard trap as
  # /api/feed above — routes match the FULL URL including the query string, so the
  # trailing `*` is not optional even though the client POSTs a body.
  #
  # `wrangler deploy --dry-run` proves nothing about routing. Verify with a live
  # curl; the three answers mean three different things (measured 2026-07-27):
  #   405 -> the Worker was NEVER REACHED. The static site answered, since it
  #          serves GET/HEAD only. This is what a missing/wrong pattern looks like.
  #   404 -> the Worker was reached but its router had no handler for that
  #          method+path (e.g. POST /api/me/bootstrap, which is GET-only).
  #   401 -> route matched, handler ran, session rejected. THIS is the target.
  #   curl.exe -s -o NUL -w "%{http_code}" -X POST https://flickto.app/api/sync \
  #     -H "Content-Type: application/json" -d "{}"
  { pattern = "flickto.app/api/sync*", zone_name = "flickto.app" },
  # Shared lists + Friend Match in D1 (src/lists.ts, src/match.ts). Same trap as
  # above — the trailing `*` covers the query string, and `/api/lists/*` does NOT
  # match a bare `/api/lists`, which is why these are wildcards over the whole
  # subtree rather than a pattern per endpoint.
  #
  # `/api/share/{code}/report` needs NO new pattern: `/api/share/*` is already
  # bound on line 12, and a duplicate pattern is a deploy error.
  { pattern = "flickto.app/api/lists/*", zone_name = "flickto.app" },
  # Bare pattern as WELL as the wildcard: `/api/match/*` does NOT match `/api/match`,
  # so the list endpoint would fall through to the static site and answer 405 while
  # every test and the dry-run stayed green. Same trap as `/api/friends` above.
  { pattern = "flickto.app/api/match", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/match/*", zone_name = "flickto.app" },
  # Comments (src/comments.ts). `/api/titles/*` covers both read paths — the public
  # list and the `/friends` slice — because every comment URL has a `{type}/{id}`
  # segment after `/api/titles`, so there is no bare path to miss here. The
  # trailing `*` still matters for a different reason: routes match the FULL URL
  # including the query string, and every comment read carries `?season=…&lang=…`.
  #
  # `/api/comments` needs BOTH forms. The bare pattern answers the POST; the
  # wildcard answers `DELETE /api/comments/{id}`. `/api/comments/*` does NOT match
  # `/api/comments`, which is the trap that has now bitten five times — and both
  # `wrangler deploy --dry-run` and the whole vitest suite stay green while the
  # route 404s to the static site. src/routing.test.ts is the thing that catches
  # the handler half; only a live curl catches the pattern half.
  { pattern = "flickto.app/api/titles/*", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/comments", zone_name = "flickto.app" },
  { pattern = "flickto.app/api/comments/*", zone_name = "flickto.app" },
  # Comment moderation, called by the /admin Pages functions with X-Admin-Key.
  # Not user-facing; gated by the ADMIN_KEY secret, which when unset closes these
  # routes rather than opening them.
  { pattern = "flickto.app/api/admin/*", zone_name = "flickto.app" },
  # GIF picker (src/giphy.ts). Trailing `*` is load-bearing as always — routes
  # match the full URL including the query string, and every call carries `?q=`
  # or `?limit=`.
  { pattern = "flickto.app/api/giphy/*", zone_name = "flickto.app" }
]


# Zero-knowledge object storage for the social channel. The relay only ever
# stores ciphertext + opaque tokens/hashes.
# Create with: wrangler r2 bucket create flickto-social
#
# LIFECYCLE RULES — APPLIED 2026-07-27, not aspirational. Verify with
#   npx wrangler r2 bucket lifecycle list flickto-social
#
#   expire-share-links          share/  expire after 31 days
#   expire-rate-limit-counters  rl/     expire after 1 day
#
# Re-create with:
#   npx wrangler r2 bucket lifecycle add flickto-social "expire-share-links" "share/" --expire-days 31 -y
#   npx wrangler r2 bucket lifecycle add flickto-social "expire-rate-limit-counters" "rl/" --expire-days 1 -y
#
# **The share/ rule is load-bearing for the privacy policy**, which states that a
# share link's data is deleted after 30 days. Expiry in the Worker is enforced on
# READ ONLY (`isExpired` → 404); nothing in code deletes the object. Without this
# rule the link stops working while the data is kept forever, and the published
# policy becomes false. That was the live state until 2026-07-27.
#
# 31 days, not 30, so the object always outlives its logical expiry rather than
# racing it — there is never a window where it is physically gone before the app
# considers it expired.
#
# These live in Cloudflare, not in this file, so nothing here can enforce them.
# Treat a claim in a comment as a claim, not a fact: check the list before relying
# on one — that is exactly how the policy came to say something untrue.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flickto-social"


# Accounts, profiles, friendships, blocks (server-authoritative — NOT zero-knowledge).
# Get the id with: wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "flickto-accounts"
database_id = "5ddfdff4-c818-4131-98aa-41350f164ce0"
# The schema is no longer hand-applied. `migrations/0001_initial.sql` is the
# recorded baseline; add `NNNN_description.sql` for every change after it.
#   npx wrangler d1 migrations list  flickto-accounts --remote
#   npx wrangler d1 migrations apply flickto-accounts --remote
# WITHOUT --remote these hit the LOCAL dev database — the two are tracked
# separately, and forgetting the flag is the usual way production drifts.
# Nothing runs this on deploy, so `npm run deploy` does it first (package.json).
migrations_dir = "migrations"



# Inline comment translation (src/comments.ts, tier 2). Free allowance is 10,000
# Neurons/day on Free *and* Paid — roughly 320,000 tokens, so ~650–1,300 NEW
# translations a day once caching is counted. Beyond that the per-comment catch
# flags the comment and the client falls back to on-device ML Kit.
#
# Costs no extra Worker REQUESTS: inference inside an invocation is a subrequest.
# Subrequests are what bind — 50 per invocation on Free — which is why the comment
# page is capped at 20.
[ai]
binding = "AI"


[vars]
SHARE_TTL_SECONDS = "2592000"
MAX_ITEMS = "100"
# Orphan-profile reaper: 365-day inactivity TTL, bounded per run. Triggered
# opportunistically from request traffic (no cron — account is at its 5-cron
# limit), at most once per REAP_INTERVAL_SECONDS.
PROFILE_TTL_SECONDS = "31536000"
GC_MAX_PREFIXES_PER_RUN = "500"
REAP_INTERVAL_SECONDS = "86400"
# Retention for `_reports/` moderation records (365d). NOTHING else prunes that
# prefix — the orphan reaper only walks friendId-shaped folders, and the admin only
# deletes on an explicit dismiss — so it grew forever until the same opportunistic
# run started pruning it. An R2 lifecycle rule on `_reports/` would do the same job
# with no code; this exists because a rule nobody has clicked is not a fix.
REPORT_TTL_SECONDS = "31536000"
# Per-IP hourly cap for share-create; inbox-post allows 6x this.
RATE_LIMIT_PER_HOUR = "10"
# Per-author hourly cap on NEW comments (edits are free — charging for a typo fix
# would cost the same as a new comment). The real anti-spam control is one comment
# per user per subject; this is the belt.
COMMENTS_PER_HOUR = "30"
# Image moderation. Set to "true" and add the VISION_API_KEY secret to enable the
# paid Cloud Vision SafeSearch scan (wrangler secret put VISION_API_KEY).
MODERATION_ENABLED = "true"
# Distinct reporters that auto-hide a picture pending admin review.
REPORT_AUTOHIDE = "3"
# Google account linking (Part 1). The OAuth **Web** client id(s) an ID token's `aud`
# may equal — comma-separated, all accepted. ACCOUNT_PEPPER is a SECRET (not here):
# `wrangler secret put ACCOUNT_PEPPER`. Until both are set, the account endpoints
# return 503 not_configured and the rest of the Worker is unaffected.
#
# TWO ids during the OAuth client migration, and BOTH are required:
#   326222246100-…  the original project — every app already on the Play Store
#                   sends this; dropping it breaks linking for real users.
#   468641021144-…  the Firebase project (flickto-cf7b6) — what new builds send.
# Drop the first only once the release cutover is done and shipped apps have
# updated. Order is irrelevant.
GOOGLE_WEB_CLIENT_ID = "326222246100-snpqapsggs1k6j9bnq2ecp37nlpfhe26.apps.googleusercontent.com,468641021144-3s841cgmadpis3qct264k7udicmbrp3r.apps.googleusercontent.com"
# Firebase Auth (Phase 1). The project **id** — a Firebase ID token's `aud` is the
# project id, NOT the project number (468641021144). Unset → /api/auth/* 503s.
FIREBASE_PROJECT_ID = "flickto-cf7b6"

# Step 4 of the shared-lists/match plan: the date the E2EE **inbox** stops being
# served, as epoch ms. UNSET means never — the default, and it changes nothing.
#
# Scoped to the inbox ONLY. `freshness` (friend profile pulls) and the friends record
# ride the same relay block and must keep working until the comments plan moves them;
# setting this does not touch them.
#
# Server-controlled on purpose: a date compiled into an app build cannot be corrected
# for anyone who never updates. Clients read it from `POST /api/sync` (`policy
# .inboxRetiresAt`) and stop asking; these endpoints refuse independently, which is
# what covers installs that never update. Both halves are needed — the client half
# saves the requests, the server half makes deletion safe.
#
# Before setting it: confirm `/api/inbox/*` traffic has fallen to ~zero in the
# Cloudflare route metrics (observability is on below). That is step 5's gate.
# RELAY_RETIRES_AT = "1790000000000"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
